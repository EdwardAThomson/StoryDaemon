genre: historical adventure
premise: >-
  In 1871 the survey brig Alcyone is charting a volcanic archipelago while
  secretly searching for the lost Meridian expedition. Elena Marsh, a
  naturalist, carries her missing brother's cipher notebook; Captain Reeve owes
  a debt he will not name; Yusuf, the quartermaster, has sailed these waters
  before and says little about it.
protagonist_archetype: Elena Marsh, a determined naturalist searching for her missing brother
setting: a survey brig among uncharted volcanic islands, 1871
tone: literary, atmospheric, slow-burning suspense
themes:
  - obsession
  - debt
  - the cost of knowledge
