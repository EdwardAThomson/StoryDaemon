genre: science fiction thriller
premise: >-
  The ore hauler Tamsin Gray is three months from port when its reactor
  begins to fail. Early in the voyage the captain is found murdered in a
  sealed compartment, and the ship's engineer, Ilse Varga, must find the killer
  among a crew of eleven before the reactor or the murderer kills them all.
protagonist_archetype: Ilse Varga, a pragmatic ship's engineer
setting: a failing deep-space ore hauler far from any port
tone: tense, claustrophobic, grounded
themes:
  - trust
  - survival
  - corporate indifference
